[package]
name = "fluxr-app-host"
version = "0.1.0"
edition = "2024"
description = "Loopback application host for checked FluxR modules"

[dependencies]
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
csv = "1.4"
calamine = "0.31"
rust_xlsxwriter = "0.92"
lopdf = { version = "0.47", default-features = false }
gix = { version = "0.77", default-features = false, features = ["basic","revision"] }
serde_yaml = "0.9"
unicode-normalization = "0.1"
unicode-segmentation = "1"

anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
fluxr = { git = "https://github.com/Ryd-rb/FluxR-lang.git", rev = "69e1898934f8954f6f03a51bd7bc9ffc1ed3b620", default-features = false }
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls","json","stream"] }
rusqlite = { version = "0.37", features = ["bundled","serde_json"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
uuid = { version = "1", features = ["v4"] }
