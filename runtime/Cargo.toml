[package]
name = "fluxr-app-host"
version = "0.1.0"
edition = "2024"
description = "Native desktop and loopback API host for checked FluxR modules"

[dependencies]
regex = "1"
diffy = "0.4"
flate2 = "1"
sha1 = "0.10"
gix-pack = { version = "0.64", default-features = false, features = ["streaming-input"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
csv = "1.4"
calamine = "0.31"
rust_xlsxwriter = "0.92"
lopdf = { version = "0.47", default-features = false }
gix = { version = "0.77", default-features = false, features = ["basic","revision","blame"] }
syn = { version = "2", features = ["full","visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_yaml = "0.9"
unicode-normalization = "0.1"
caseless = "=0.2.2"
unicode-segmentation = "1"

pulldown-cmark = { version = "0.13", default-features = false }
same-file = "1"
notify = "8.2"
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
fluxr = { git = "https://github.com/Ryd-rb/FluxR-lang.git", rev = "6fe5f1ce7cf77f672208b7e45e3e970eae3db0a7", default-features = false }
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls","json","stream"] }
rusqlite = { version = "0.37", features = ["bundled","serde_json","functions"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rcgen = "0.13"

[target.'cfg(windows)'.dependencies]
fluxr-win32 = { git = "https://github.com/Ryd-rb/FluxR-lang.git", rev = "6fe5f1ce7cf77f672208b7e45e3e970eae3db0a7" }
rfd = { version = "0.17", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_Storage_FileSystem","Win32_Security","Win32_System_IO"] }
